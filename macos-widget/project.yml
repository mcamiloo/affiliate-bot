name: OmbroPanel
options:
  bundleIdPrefix: com.miguelcamilo
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: YES
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  OmbroPanel:
    type: application
    platform: macOS
    sources:
      - path: OmbroPanel
        excludes:
          - "Info.plist"
          - "OmbroPanel.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miguelcamilo.ombropanel
        PRODUCT_NAME: OmbroPanel
        INFOPLIST_FILE: OmbroPanel/Info.plist
        CODE_SIGN_ENTITLEMENTS: OmbroPanel/OmbroPanel.entitlements
    dependencies:
      - target: OmbroPanelWidgetExtension
        embed: true
  OmbroPanelWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: OmbroPanelWidget
        excludes:
          - "Info.plist"
          - "OmbroPanelWidget.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miguelcamilo.ombropanel.widget
        PRODUCT_NAME: OmbroPanelWidget
        INFOPLIST_FILE: OmbroPanelWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: OmbroPanelWidget/OmbroPanelWidget.entitlements
        SKIP_INSTALL: NO
schemes:
  OmbroPanel:
    build:
      targets:
        OmbroPanel: all
    run:
      config: Release
    archive:
      config: Release
